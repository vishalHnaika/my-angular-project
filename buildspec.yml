version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - echo Installing dependencies...
      - npm ci

  pre_build:
    commands:
      - echo Build started...
      - node --version
      - npm --version

  build:
    commands:
      - echo Building Angular application...
      - npm run build -- --configuration production

  post_build:
    commands:
      - echo Angular build completed successfully...
      - echo Build output:
      - ls -la dist/my-angular-project

artifacts:
  base-directory: dist/my-angular-project
  files:
    - '**/*'